<title>GanitaDrishti by Balaji</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: graph-paper workbench. A sticky header, a concept rail on the left, the working surface on the right. */
:root{
  --paper:#F1F5F3; --surface:#FFFFFF; --sunk:#E9EFEC; --ink:#12242A; --muted:#55686D; --line:#D2DCD7;
  --grid:#E1E9E5; --grid2:#C9D6D0;
  --accent:#0C7660; --accent-ink:#FFFFFF; --accent-weak:#DAEEE7;
  --vec:#2D58A6; --vec-weak:#E0E8F6;
  --good:#1D8548; --good-weak:#DFF1E6; --warn:#9E6410; --warn-weak:#FAEFD9; --bad:#BF3F0B; --bad-weak:#FBE6DB;
  --display:'Bricolage Grotesque','Noto Sans Tamil',system-ui,sans-serif;
  --body:'Source Sans 3','Noto Sans Tamil',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1618; --surface:#152125; --sunk:#111B1E; --ink:#E3ECEA; --muted:#92A5A8; --line:#29393D;
  --grid:#1A272B; --grid2:#24353A;
  --accent:#3DC09E; --accent-ink:#06231C; --accent-weak:#143A31;
  --vec:#82A8F2; --vec-weak:#1B2A44;
  --good:#4CC27E; --good-weak:#15331F; --warn:#E3AA4E; --warn-weak:#3A2C12; --bad:#F2804F; --bad-weak:#3E2015;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0E1618; --surface:#152125; --sunk:#111B1E; --ink:#E3ECEA; --muted:#92A5A8; --line:#29393D;
  --grid:#1A272B; --grid2:#24353A;
  --accent:#3DC09E; --accent-ink:#06231C; --accent-weak:#143A31;
  --vec:#82A8F2; --vec-weak:#1B2A44;
  --good:#4CC27E; --good-weak:#15331F; --warn:#E3AA4E; --warn-weak:#3A2C12; --bad:#F2804F; --bad-weak:#3E2015;
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[lang="ta"]{font-family:'Noto Sans Tamil',var(--body)}
.sub-en{display:block;font-size:.84em;color:var(--muted)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 22px/1 var(--display)}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:-.01em;display:block}
.brand small{color:var(--muted);font-size:13px;display:block}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:14px}
.ainote{font-size:13.5px;color:var(--warn);background:var(--warn-weak);border-radius:8px;padding:6px 12px;margin:10px auto 0;max-width:1240px}

/* student shell */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:auto 1fr;gap:18px 22px;margin:18px auto 0;max-width:1240px}
.railC{grid-column:1;grid-row:1}.railX{grid-column:1;grid-row:2;align-self:start}#main{grid-column:2;grid-row:1 / span 2}
@media (max-width:880px){.shell{grid-template-columns:minmax(0,1fr)}.railC,.railX,#main{grid-column:1;grid-row:auto}
 .railC{flex-direction:row;overflow-x:auto;gap:14px;padding-bottom:4px}.railC>div{flex:none}.railC .clist{flex-direction:row}.railC .cbtn{width:210px}}
.rail{display:flex;flex-direction:column;gap:18px}
.rail h4{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.clist{display:flex;flex-direction:column;gap:6px}
.cbtn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.cbtn[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.cbtn .nm{font-weight:600;display:block}
.meter{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px}
.cbtn .pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mislist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.mislist li{font-size:14px;background:var(--bad-weak);border-radius:8px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start}
.mislist .n{font:600 12px var(--mono);background:var(--bad);color:var(--surface);border-radius:6px;padding:1px 6px;flex:none}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* main surface */
.chead{display:flex;flex-wrap:wrap;align-items:end;gap:10px 16px;margin-bottom:12px}
.chead .eyebrow{font-size:13px;color:var(--muted);letter-spacing:.04em;width:100%}
.chead h2{font-size:clamp(26px,3.4vw,36px)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--mono);padding:5px 8px;border-radius:6px;background:var(--accent-weak);color:var(--accent)}
.chip.ai{background:var(--vec-weak);color:var(--vec)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0 16px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 10px;text-align:left;display:flex;gap:10px;align-items:center;min-width:0}
.steps .no{font:600 13px var(--mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);flex:none}
.steps button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-weak)}
.steps button[aria-selected="true"] .no{background:var(--accent);color:var(--accent-ink)}
.steps .lbl{font-weight:600;line-height:1.2;min-width:0}
.steps .lbl .sub-en{font-weight:400}
@media (max-width:600px){.steps{gap:4px}.steps button{padding:8px 6px;justify-content:center;text-align:center}.steps .no{display:none}.steps .lbl{font-size:14px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.lead{max-width:68ch;margin:0 0 12px;font-size:17px}
.hint{color:var(--muted);margin:0 0 14px;max-width:70ch}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stage canvas{display:block;width:100%;height:360px;touch-action:none}
@media (max-width:600px){.stage canvas{height:300px}}
.readout{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 14px;border-top:1px solid var(--line);font:14px var(--mono);font-variant-numeric:tabular-nums}
.readout b{font-weight:600}
.readout .flag{color:var(--good);font-weight:600}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px;margin-top:12px}
.ctrl label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:2px}
.ctrl output{font:600 14px var(--mono);color:var(--ink)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--grid2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ai{border-color:var(--vec);color:var(--vec)}
.btn.small{padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stepnav{display:flex;justify-content:flex-end;margin-top:16px}

/* ask */
.qlist{display:flex;flex-direction:column;gap:14px}
.qcard .qn{font:600 12px var(--mono);color:var(--muted);margin-bottom:4px}
.qcard .qt{font-weight:600;font-size:17px;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start}
.opt .k{font:600 13px var(--mono);color:var(--muted);flex:none;padding-top:1px}
.opt.right{border-color:var(--good);background:var(--good-weak)}
.opt.wrong{border-color:var(--bad);background:var(--bad-weak)}
.fb{margin-top:10px;font-size:15px;padding:8px 12px;border-radius:8px}
.fb.good{background:var(--good-weak)} .fb.bad{background:var(--bad-weak)}
.fb .tag{font:600 12px var(--mono);color:var(--bad)}
.chat{margin-top:18px}
.msgs{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{padding:9px 12px;border-radius:10px;max-width:80ch;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent-weak)}
.msg.ai{align-self:flex-start;background:var(--sunk)}
textarea.box{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;resize:vertical}

/* check */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.prob{font-size:18px;font-weight:600;margin:0 0 10px}
textarea.work{width:100%;min-height:170px;font:15px/1.7 var(--mono);border:1px solid var(--line);background:var(--surface) repeating-linear-gradient(transparent 0 calc(1.7em - 1px),var(--grid) calc(1.7em - 1px) 1.7em);background-attachment:local;border-radius:8px;padding:6px 12px;resize:vertical;background-position:0 6px}
.note{font-size:13.5px;color:var(--muted)}
.lines{margin:10px 0 0;padding:0;list-style:none;font:14px/1.6 var(--mono);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lines li{display:flex;gap:10px;padding:3px 10px;border-top:1px solid var(--grid)}
.lines li:first-child{border-top:0}
.lines .ln{color:var(--muted);width:2ch;text-align:right;flex:none}
.lines li.bad{background:var(--bad-weak);box-shadow:inset 3px 0 0 var(--bad)}
.lines li.ok{background:var(--good-weak)}
.result{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:4px 10px;border-radius:999px;font-size:14px;width:max-content}
.pill.ok{background:var(--good-weak);color:var(--good)} .pill.bad{background:var(--bad-weak);color:var(--bad)} .pill.part{background:var(--warn-weak);color:var(--warn)}
.misbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.misbox .id{font:600 12px var(--mono);color:var(--bad)}
.sol{white-space:pre-wrap;font:14.5px/1.7 var(--mono);background:var(--sunk);border-radius:8px;padding:10px 12px;margin:10px 0 0}
.filein{font-size:14px;max-width:100%}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center}

/* apply */
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:22px;height:8px;border-radius:4px;background:var(--sunk)}
.pips i.on{background:var(--accent)}
.ansrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ansrow input{width:160px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font:16px var(--mono)}

/* college */
.ctabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px auto 16px;max-width:1240px;overflow-x:auto}
.ctabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ctabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.cwrap{max-width:1240px;margin:0 auto}
.course{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:18px auto 0;max-width:1240px}
.course h2{font-size:clamp(24px,3vw,32px)}
.qpgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
.qpgrid.rev{grid-template-columns:minmax(0,1fr) 320px}
@media (max-width:980px){.qpgrid,.qpgrid.rev{grid-template-columns:minmax(0,1fr)}}
.form{display:flex;flex-direction:column;gap:12px}
.form .f label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.form .f output{font:600 14px var(--mono);color:var(--ink)}
.form input[type=range]{width:100%;accent-color:var(--accent)}
.form input[type=number],.form input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.checks li{display:flex;justify-content:space-between;gap:8px}
.checks .v{font:600 13px var(--mono)}
.ok-t{color:var(--good)} .bad-t{color:var(--bad)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px clamp(14px,3vw,34px);box-shadow:0 1px 0 var(--line),0 8px 24px -18px rgba(0,0,0,.35)}
.sheet .hd{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
.sheet .hd b{font-family:var(--display);font-size:20px;display:block}
.sheet .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:14px;margin:6px 0 14px}
.sheet h3{font-size:16px;text-align:center;margin:16px 0 8px;letter-spacing:.04em}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.tbl th{background:var(--sunk);font-weight:600;font-size:13px}
.tbl td.c,.tbl th.c{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .or td{text-align:center;font-weight:600;color:var(--muted);padding:2px}
.scroll{overflow-x:auto;max-width:100%}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px}
.bar .track{position:relative;height:14px;background:var(--sunk);border-radius:4px}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bar .val{font:600 13px var(--mono);text-align:right}
.spark{width:100%;height:56px;display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.status{font:600 12px var(--mono);padding:3px 7px;border-radius:5px}
.status.met{background:var(--good-weak);color:var(--good)} .status.gap{background:var(--bad-weak);color:var(--bad)}
.heat td.v{text-align:center;font:600 13px var(--mono);cursor:pointer;min-width:58px}
.heat td.v:hover{outline:2px solid var(--ink);outline-offset:-2px}
.heat th.rot{font:600 11.5px var(--mono);white-space:nowrap}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:8px}
.legend .ramp{width:140px;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--surface),var(--bad))}
.detail{position:sticky;top:80px}
.mini{font-size:13.5px}
.tbl input[type=text]{width:100%;min-width:220px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px}
.tbl select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px}
#modal[hidden]{display:none}
.coursesel{font:700 clamp(18px,2.4vw,24px)/1.2 var(--display);padding:6px 10px;max-width:100%;min-width:0}
.lib{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.libnow{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.libnext{margin-top:8px}.libnext ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.plist{padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (max-width:880px){.railC .lib{width:250px}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
#modal .card{width:min(720px,100%);max-height:85vh;display:flex;flex-direction:column;gap:10px}
#modal textarea{flex:1;min-height:260px;font:13px var(--mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:14px;z-index:30}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><span class="mark" aria-hidden="true">∂</span><div><b>GanitaDrishti</b><small id="tagline"></small></div></div>
  <div class="seg" role="group" aria-label="View">
    <button id="roleStudent" type="button"></button><button id="roleCollege" type="button"></button>
  </div>
  <select id="lang" class="sel" aria-label="Language">
    <option value="en">English</option><option value="ta">தமிழ்</option><option value="both">தமிழ் + English</option>
  </select>
</div></header>
<div id="aiNote" class="ainote" hidden></div>
<main id="app"></main>
<div id="modal" hidden></div>

<script>
/* ---------- GanitaDrishti: content data ---------- */
const UI = {
  student:{en:'Student', ta:'மாணவர்'},
  college:{en:'College', ta:'கல்லூரி'},
  tagline:{en:'Engineering mathematics you can see', ta:'காட்சி வழிப் பொறியியல் கணிதம்'},
  see:{en:'See', ta:'பார்'}, ask:{en:'Ask', ta:'கேள்'}, check:{en:'Check', ta:'சரிபார்'}, apply:{en:'Apply', ta:'பயன்படுத்து'},
  seeHint:{en:'Move the controls and watch the idea take shape.', ta:'கட்டுப்பாடுகளை நகர்த்தி, கருத்து உருவாவதைப் பாருங்கள்.'},

/* Expression parser: plain-text maths -> function of x */
function parseExpr(src){
  let s = String(src).toLowerCase()
    .replace(/[−–]/g,'-').replace(/[×·∙]/g,'*').replace(/÷/g,'/')
    .replace(/²/g,'^2').replace(/³/g,'^3').replace(/π/g,'pi').replace(/λ/g,'x')
    .replace(/\*\*/g,'^');
  const toks = []; let i = 0; let usesVar = false;
  while (i < s.length){
    const c = s[i];
    if (c === ' ' || c === '\t'){ i++; continue; }
    if (/[0-9.]/.test(c)){ let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; const v = parseFloat(s.slice(i,j)); if (!isFinite(v)) throw new Error('num'); toks.push({t:'num',v}); i = j; continue; }
    if (/[a-z]/.test(c)){
      let j = i; while (j < s.length && /[a-z]/.test(s[j])) j++;
      let w = s.slice(i,j); i = j;
      while (w.length){
        const fn = ['sqrt','sin','cos','tan','exp','ln','log','pi'].find(f => w.startsWith(f));
        if (fn){ toks.push(fn === 'pi' ? {t:'num',v:Math.PI} : {t:'fn',v:fn}); w = w.slice(fn.length); }
        else if (w[0] === 'x'){ toks.push({t:'var'}); usesVar = true; w = w.slice(1); }
        else if (w[0] === 'e'){ toks.push({t:'num',v:Math.E}); w = w.slice(1); }
        else throw new Error('word');
      }
      continue;
    }
    if ('+-*/^()'.includes(c)){ toks.push({t:'op',v:c}); i++; continue; }
    throw new Error('char');
  }
  const out = [];
  for (const b of toks){
    const a = out[out.length-1];
    const endsVal = a && (a.t === 'num' || a.t === 'var' || (a.t === 'op' && a.v === ')'));
    const startsVal = b.t === 'num' || b.t === 'var' || b.t === 'fn' || (b.t === 'op' && b.v === '(');
    if (endsVal && startsVal) out.push({t:'op',v:'*',imp:true});
    out.push(b);
  }
  let p = 0;
  const peek = () => out[p];
  const isOp = (v) => peek() && peek().t === 'op' && peek().v === v;
  const F = {sin:Math.sin, cos:Math.cos, tan:Math.tan, exp:Math.exp, ln:Math.log, log:Math.log, sqrt:Math.sqrt};
  function expr(){ let n = term(); while (isOp('+') || isOp('-')){ const o = out[p++].v; const r = term(); const l = n; n = o === '+' ? x => l(x) + r(x) : x => l(x) - r(x); } return n; }
  function term(){ let n = unary(); while (isOp('*') || isOp('/')){ const o = out[p++].v; const r = unary(); const l = n; n = o === '*' ? x => l(x) * r(x) : x => l(x) / r(x); } return n; }
  function unary(){ if (isOp('-')){ p++; const u = unary(); return x => -u(x); } if (isOp('+')){ p++; return unary(); } return power(); }
  function power(){ const b = atom(); if (isOp('^')){ p++; const e = unary(); return x => Math.pow(b(x), e(x)); } return b; }
  function atom(){
    const tk = out[p++]; if (!tk) throw new Error('end');
    if (tk.t === 'num'){ const v = tk.v; return () => v; }
    if (tk.t === 'var') return x => x;
    if (tk.t === 'fn'){
      const f = F[tk.v]; let pw = null;
      if (isOp('^')){ p++; pw = atom(); }
      let arg;
      if (isOp('(')) arg = atom();
      else {
        arg = power();
        while (peek() && peek().imp && out[p+1] && out[p+1].t !== 'fn'){ p++; const r = power(); const l = arg; arg = x => l(x) * r(x); }
      }
      return pw ? x => Math.pow(f(arg(x)), pw(x)) : x => f(arg(x));
    }
    if (tk.t === 'op' && tk.v === '('){ const n = expr(); const c = out[p++]; if (!c || c.v !== ')') throw new Error('paren'); return n; }
    throw new Error('unexpected');
  }
  if (!out.length) throw new Error('empty');
  const fn = expr();
  if (p !== out.length) throw new Error('trailing');
  fn.usesVar = usesVar;
  return fn;
}
function tryParse(s){ try { const f = parseExpr(s); const v = f(0.731); if (typeof v !== 'number') return null; return f; } catch (e) { return null; } }

const PTS = [0.37, 1.13, 2.41, -0.83, 1.71];
function sameFn(f, g){
  for (const x of PTS){ const a = f(x), b = g(x); if (!isFinite(a) || !isFinite(b)) return false; if (Math.abs(a - b) > 1e-6 * (1 + Math.abs(b))) return false; }
  return true;
}
function proportional(f, g){
  let r = null;
  for (const x of PTS){
    const a = f(x), b = g(x); if (!isFinite(a) || !isFinite(b)) return false;
    if (Math.abs(b) < 1e-9){ if (Math.abs(a) > 1e-6) return false; continue; }
    const q = a / b; if (r === null) r = q; else if (Math.abs(q - r) > 1e-6 * (1 + Math.abs(r))) return false;
  }
  return r !== null && Math.abs(r) > 1e-9;
}
function splitEq(line){ const parts = line.split('='); return {lhs: parts.slice(0, -1).join('=').trim(), rhs: parts[parts.length - 1].trim(), hasEq: parts.length > 1}; }
function numsIn(s){
  const clean = String(s).replace(/[−–]/g,'-').replace(/[a-zA-Zλ]+_?\d+/g,' ');
  return (clean.match(/-?\d+(?:\.\d+)?(?:\/\d+)?/g) || []).map(t => { if (t.includes('/')){ const [a,b] = t.split('/'); return parseFloat(a)/parseFloat(b); } return parseFloat(t); });
}
const close = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol * (1 + Math.abs(b));
function sameSet(a, b){ if (a.length !== b.length) return false; const x = [...a].sort((p,q)=>p-q), y = [...b].sort((p,q)=>p-q); return x.every((v,i) => close(v, y[i], 1e-4)); }

/* Offline step checker. Returns {status:'ok'|'wrong'|'partial'|'unread', line, mis, note} (line is 0-based) */
function localCheck(cfg, text){
  const lines = String(text).split('\n');
  const idx = lines.map((l,i) => l.trim() ? i : -1).filter(i => i >= 0);
  if (!idx.length) return {status:'unread'};
  if (cfg.type === 'expr') return checkExpr(cfg, lines, idx);
  if (cfg.type === 'crit') return checkCrit(cfg, lines, idx);
  if (cfg.type === 'num') return checkNum(cfg, lines, idx);
  if (cfg.type === 'set') return checkSet(cfg, lines, idx);
  return {status:'unread'};
}
function checkExpr(cfg, lines, idx){
  const f = parseExpr(cfg.f), tgt = parseExpr(cfg.target);
  const sigs = cfg.sigs.map(([e, m]) => [parseExpr(e), m]);
  let flagged = null, lastParsed = -1, lastOk = false, any = false;
  for (const i of idx){
    const g = tryParse(splitEq(lines[i]).rhs); if (!g) continue;
    any = true; lastParsed = i;
    if (sameFn(g, f)){ lastOk = false; continue; }
    if (sameFn(g, tgt)){ lastOk = true; continue; }
    lastOk = false;
    if (!flagged){ const m = sigs.find(([s]) => sameFn(g, s)); flagged = {line:i, mis: m ? m[1] : 'M_UNKNOWN'}; }
  }
  if (!any) return {status:'unread'};
  if (flagged) return {status:'wrong', ...flagged};
  if (lastOk) return {status:'ok'};
  return {status:'partial', line:lastParsed, note:'unfinished'};
}
function classifyWord(s){ s = s.toLowerCase(); if (/max|பெரும/.test(s)) return 'max'; if (/min|சிறும/.test(s)) return 'min'; return null; }
function checkCrit(cfg, lines, idx){
  const fp = parseExpr(cfg.fprime), fpp = parseExpr(cfg.fsecond);
  let flagged = null;
  const flag = (i, m) => { if (!flagged) flagged = {line:i, mis:m}; };
  let ansLines = idx.filter(i => classifyWord(lines[i]));
  if (!ansLines.length) ansLines = [idx[idx.length - 1]];
  for (const i of idx){
    if (ansLines.includes(i)) continue;
    const ln = lines[i]; const {lhs, rhs, hasEq} = splitEq(ln); if (!hasEq) continue;
    const L = lhs.replace(/\s/g,'').toLowerCase();
    if (/f''|f″|y''|y″|d2y/.test(L)){ const g = tryParse(rhs); if (g && !sameFn(g, fpp)) flag(i, 'M_ARITH'); }
    else if (/f'|f′|y'|y′|dy\/dx/.test(L)){ const g = tryParse(rhs); if (g && !sameFn(g, fp) && !proportional(g, fp)) flag(i, 'M_ARITH'); }
    else if (rhs === '0'){ const g = tryParse(lhs); if (g && g.usesVar && !proportional(g, fp)) flag(i, 'M_FACTOR'); }
  }
  const pts = [];
  for (const i of ansLines){
    for (const seg of lines[i].split(/[,;]|\band\b|மற்றும்/)){
      const m = seg.match(/x\s*=\s*(-?\d+(?:\.\d+)?(?:\/\d+)?)/i);
      const n = m ? numsIn(m[1]) : numsIn(seg);
      if (n.length) pts.push({x:n[0], t:classifyWord(seg)});
    }
  }
  const ansLine = ansLines[ansLines.length - 1];
  if (flagged) return {status:'wrong', ...flagged};
  if (!pts.length) return {status:'unread'};
  const xs = pts.map(p => p.x), ex = cfg.expect.map(e => e.x);
  if (!sameSet(xs, ex)) return {status:'wrong', line:ansLine, mis:'M_FACTOR'};
  const typed = pts.filter(p => p.t);
  if (!typed.length) return {status:'partial', line:ansLine, note:'classify'};
  const right = pts.every(p => { const e = cfg.expect.find(q => close(q.x, p.x, 1e-4)); return p.t === e.t; });
  if (right && typed.length === pts.length) return {status:'ok'};
  const swapped = typed.every(p => { const e = cfg.expect.find(q => close(q.x, p.x, 1e-4)); return p.t !== e.t; });
  if (swapped) return {status:'wrong', line:ansLine, mis:'M_SECOND_DERIV_SIGN'};
  return {status:'partial', line:ansLine, note:'classify'};
}
function checkNum(cfg, lines, idx){
  let flagged = null, last = null, lastLine = -1;
  for (const i of idx){
    const g = tryParse(splitEq(lines[i]).rhs);
    if (!g || g.usesVar) continue;
    const v = g(0); if (!isFinite(v)) continue;
    last = v; lastLine = i;
    if (!close(v, cfg.answer, 1e-6) && !flagged){
      const key = String(Math.round(v * 1000) / 1000);
      flagged = {line:i, mis: cfg.sigs[key] || 'M_ARITH'};
    }
  }
  if (last === null) return {status:'unread'};
  if (flagged) return {status:'wrong', ...flagged};
  return close(last, cfg.answer, 1e-6) ? {status:'ok'} : {status:'wrong', line:lastLine, mis:'M_ARITH'};
}
function checkSet(cfg, lines, idx){
  const P = parseExpr(cfg.poly);
  let flagged = null;
  const ansLine = idx[idx.length - 1];
  for (const i of idx){
    if (i === ansLine) continue;
    const {lhs, rhs, hasEq} = splitEq(lines[i]);
    let g = null;
    if (hasEq && rhs === '0') g = tryParse(lhs); else g = tryParse(rhs);
    if (g && g.usesVar && !proportional(g, P) && !flagged) flagged = {line:i, mis:'M_CHAR_EQ_SIGN'};
  }
  const vals = numsIn(lines[ansLine]);
  if (!vals.length) return flagged ? {status:'wrong', ...flagged} : {status:'unread'};
  if (sameSet(vals, cfg.answer)) return flagged ? {status:'wrong', ...flagged} : {status:'ok'};
  const sig = cfg.sigs.find(([s]) => sameSet(vals, s));
  if (flagged && !sig) return {status:'wrong', ...flagged};
  return {status:'wrong', line: flagged ? flagged.line : ansLine, mis: flagged ? flagged.mis : (sig ? sig[1] : 'M_ARITH')};
}

  ],

/* ---------- Seeded random ---------- */
function rng(seed){ let s = (seed >>> 0) || 0x9e3779b9; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function gauss(R){ const u = Math.max(R(), 1e-9), v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

/* ---------- Question paper assembly: Jumping Particle Swarm Optimisation ----------
   Pattern: Part A 10 × 2 marks (2 per CO); Part B 5 × 16 marks, internal choice (a)/(b), same CO.
   A particle chooses one question per slot. Each iteration every slot "jumps" to the particle's own best,
   the swarm's best, or a random candidate (JPSO), followed by a one-flip local search on the global best. */
function buildSlots(course, pat){
  pat = pat || {aCount:10, bCount:5};
  const ids = course.cos.map(c => c.id);
  const isA = q => q.m === 2, isB = q => q.m !== 2;
  const cosA = ids.filter(co => course.bank.some(q => q.co === co && isA(q)));
  const cosB = ids.filter(co => course.bank.some(q => q.co === co && isB(q)));
  const A = [], B = [];
  // round-robin over COs, never giving a CO more slots than it has distinct questions
  const capA = Object.fromEntries(cosA.map(co => [co, course.bank.filter(q => q.co === co && isA(q)).length]));
  const capB = Object.fromEntries(cosB.map(co => [co, Math.floor(course.bank.filter(q => q.co === co && isB(q)).length / 2)]));
  const useA = {}, useB = {};
  if (cosA.length) for (let i = 0, k = 0; A.length < pat.aCount && k < pat.aCount * Math.max(1, cosA.length) * 2; k++){
    const co = cosA[k % cosA.length]; if ((useA[co] || 0) >= capA[co]) { if (cosA.every(c => (useA[c] || 0) >= capA[c])) break; continue; }
    useA[co] = (useA[co] || 0) + 1; A.push({part:'A', co, cands: course.bank.filter(q => q.co === co && isA(q))});
  }
  if (cosB.length) for (let j = 0, k = 0; j < pat.bCount && k < pat.bCount * Math.max(1, cosB.length) * 2; k++){
    const co = cosB[k % cosB.length]; if ((useB[co] || 0) >= capB[co]) { if (cosB.every(c => (useB[c] || 0) >= capB[c])) break; continue; }
    useB[co] = (useB[co] || 0) + 1; const cands = course.bank.filter(q => q.co === co && isB(q));
    B.push({part:'B', co, cands, opt:'a', pair:j}, {part:'B', co, cands, opt:'b', pair:j}); j++;
  }
  A.sort((x, y) => ids.indexOf(x.co) - ids.indexOf(y.co));
  B.sort((x, y) => ids.indexOf(x.co) - ids.indexOf(y.co) || x.pair - y.pair || (x.opt < y.opt ? -1 : 1));
  // renumber pairs after sorting so Part B questions run in CO order
  let k = -1, last = null; for (const s of B){ if (s.pair !== last){ last = s.pair; k++; } s.pno = k; }
  B.forEach(s => s.pair = s.pno);
  return A.concat(B);
}
function paperStats(qs, bMarks = 16){
  // weights: Part A question = 2 marks; a Part B option = half its marks, as either (a) or (b) is answered
  let low = 0, mid = 0, high = 0, tot = 0, dB = 0, nB = 0;
  for (const q of qs){ if (!q) continue; const w = q.m === 2 ? 2 : bMarks / 2; tot += w; if (q.k <= 2) low += w; else if (q.k === 3) mid += w; else high += w; if (q.m !== 2){ dB += q.d; nB++; } }
  if (!tot) return {low:0, mid:0, high:0, diffB:0};
  return {low: 100*low/tot, mid: 100*mid/tot, high: 100*high/tot, diffB: nB ? dB/nB : 0};
}
function paperCost(qs, slots, cfg){
  let pen = 0;
  const ids = qs.filter(Boolean).map(q => q.id);
  pen += 1000 * (ids.length - new Set(ids).size);
  for (let i = 0; i < slots.length; i++) if (!qs[i] || qs[i].co !== slots[i].co) pen += 1000;
  const st = paperStats(qs, cfg.bMarks || 16);
  pen += 3 * Math.max(0, st.low - cfg.lowMax);
  pen += 3 * Math.max(0, cfg.highMin - st.high);
  pen += 1 * Math.max(0, cfg.midMin - st.mid);
  pen += 25 * Math.abs(st.diffB - cfg.diffTarget);
  for (let i = 0; i < slots.length; i++) if (slots[i].opt === 'a'){ const a = qs[i], b = qs[i+1]; if (a && b) pen += 6 * Math.abs(a.d - b.d) + 2 * Math.abs(a.k - b.k); }
  if (cfg.avoid && cfg.prev) pen += 12 * ids.filter(id => cfg.prev.includes(id)).length;
  return pen;
}
function jpsoPaper(course, cfg){
  const R = rng(cfg.seed);
  const bMarks = cfg.bMarks || 16;
  const slots = buildSlots(course, {aCount:10, bCount:5});
  if (!slots.length) return {slots, qs:[], cost:0, hist:[0, 0], stats:paperStats([], bMarks), bMarks, empty:true};
  const N = 24, ITER = 70;
  const decode = pos => pos.map((c, i) => slots[i].cands[c]);
  const cost = pos => paperCost(decode(pos), slots, cfg);
  const rand = () => slots.map(s => Math.floor(R() * Math.max(1, s.cands.length)));
  let parts = Array.from({length:N}, () => { const x = rand(); return {x, c: cost(x), bx: x.slice(), bc: 0}; });
  parts.forEach(p => p.bc = p.c);
  let g = parts.reduce((a, b) => a.c <= b.c ? a : b); let gx = g.x.slice(), gc = g.c;
  const hist = [gc];
  for (let it = 0; it < ITER; it++){
    for (const p of parts){
      for (let s = 0; s < slots.length; s++){
        const r = R();
        if (r < 0.12) p.x[s] = Math.floor(R() * Math.max(1, slots[s].cands.length));
        else if (r < 0.40) p.x[s] = p.bx[s];
        else if (r < 0.75) p.x[s] = gx[s];
      }
      p.c = cost(p.x);
      if (p.c < p.bc){ p.bc = p.c; p.bx = p.x.slice(); }
      if (p.c < gc){ gc = p.c; gx = p.x.slice(); }
    }
    // local search: best single-slot change on the global best
    let improved = true;
    while (improved){
      improved = false;
      for (let s = 0; s < slots.length; s++){
        for (let c = 0; c < slots[s].cands.length; c++){
          if (c === gx[s]) continue; const y = gx.slice(); y[s] = c; const yc = cost(y);
          if (yc < gc - 1e-9){ gc = yc; gx = y; improved = true; }
        }
      }
    }
    hist.push(gc);
  }
  const qs = decode(gx);
  return {slots, qs, cost: gc, hist, stats: paperStats(qs, bMarks), bMarks};
}

/* ---------- Marks, CO and PO attainment ---------- */
// paper -> question numbers: Part A Q1..Qn (2 marks each), then Part B pairs (either a or b)
function paperQuestions(paper){
  const out = [];
  const A = paper.slots.map((s, i) => [s, paper.qs[i]]).filter(([s]) => s.part === 'A');
  A.forEach(([s, q], i) => out.push({no:'Q' + (i+1), co:s.co, max:2, items:[q]}));
  const pairs = [...new Set(paper.slots.filter(s => s.part === 'B').map(s => s.pair))];
  pairs.forEach((pr, j) => {
    const ia = paper.slots.findIndex(s => s.part === 'B' && s.pair === pr && s.opt === 'a');
    const ib = paper.slots.findIndex(s => s.part === 'B' && s.pair === pr && s.opt === 'b');
    out.push({no:'Q' + (A.length + 1 + j), co:paper.slots[ia].co, max:paper.bMarks || 16, items:[paper.qs[ia], paper.qs[ib]]});
  });
  return out;
}
function sampleMarks(paper, n = 60, seed = 7){
  const R = rng(seed); const qs = paperQuestions(paper);
  const weak = {CO1:0, CO2:0.25, CO3:-0.1, CO4:0.75, CO5:0.1};
  const rows = [];
  for (let s = 0; s < n; s++){
    const th = gauss(R); const row = {roll: '23ME' + String(101 + s)};
    for (const q of qs){
      const item = q.items.length > 1 ? (R() < 0.5 ? q.items[0] : q.items[1]) : q.items[0];
      const z = 1.25 * th + 0.9 - 0.6 * ((item ? item.d : 2) - 2) - (weak[q.co] || 0) + 0.35 * gauss(R);
      const p = 1 / (1 + Math.exp(-z));
      row[q.no] = Math.max(0, Math.min(q.max, Math.round(q.max * p)));
    }
    rows.push(row);
  }
  return rows;
}
function parseMarksCSV(text, qnos){
  const lines = String(text).replace(/\r/g,'').split('\n').filter(l => l.trim());
  if (lines.length < 2) throw new Error('The file needs a header row and at least one student row.');
  const head = lines[0].split(',').map(h => h.trim().toUpperCase());
  const missing = qnos.filter(q => !head.includes(q.toUpperCase()));
  if (missing.length) throw new Error('Missing columns: ' + missing.join(', ') + '. Download the template for the expected layout.');
  return lines.slice(1).map((l, r) => {
    const cells = l.split(',').map(c => c.trim()); const row = {roll: cells[0] || ('Row ' + (r+2))};
    qnos.forEach(q => { const v = parseFloat(cells[head.indexOf(q.toUpperCase())]); row[q] = isFinite(v) ? v : 0; });
    return row;
  });
}
function attainment(paper, rows, course, cfg){
  const qs = paperQuestions(paper);
  const coIds = course.cos.map(c => c.id);
  const co = {};
  for (const id of coIds){
    const mine = qs.filter(q => q.co === id); const max = mine.reduce((a, q) => a + q.max, 0);
    if (!max){ co[id] = null; continue; }
    const pass = rows.filter(r => mine.reduce((a, q) => a + (r[q.no] || 0), 0) >= cfg.threshold / 100 * max).length;
    const pct = rows.length ? 100 * pass / rows.length : 0;
    const level = pct >= cfg.l3 ? 3 : pct >= cfg.l2 ? 2 : pct >= cfg.l1 ? 1 : 0;
    const indirect = cfg.indirect[id] != null ? cfg.indirect[id] : 2.5;
    const final = (cfg.wDirect / 100) * level + (1 - cfg.wDirect / 100) * indirect;
    co[id] = {max, pass, pct, level, indirect, final};
  }
  const po = {};
  for (const [p] of (course.pos || POS)){
    let num = 0, den = 0;
    for (const id of coIds){ const w = (course.map[id] || {})[p] || 0; if (w && co[id]){ num += w * co[id].final; den += w; } }
    po[p] = den ? num / den : null;
  }
  return {co, po, n: rows.length};
}

/* ---------- Sample misconception data for the college heatmap ---------- */
function sampleHeat(){
  const ids = ['M_PRODUCT','M_SIGN_TRIG','M_LIMIT_SUB','M_VALUE_SLOPE','M_CRIT_ALWAYS_EXT','M_SECOND_DERIV_SIGN','M_FACTOR','M_ROW_COL','M_DET_SIGN','M_DET_ZERO_MATRIX','M_EIGEN_DIAG','M_CHAR_EQ_SIGN'];
  const bias = {'I-A (Mech)':{M_PRODUCT:18, M_SECOND_DERIV_SIGN:10}, 'I-B (Civil)':{M_FACTOR:16, M_DET_SIGN:12}, 'I-C (ECE)':{M_SIGN_TRIG:20, M_LIMIT_SUB:8}, 'I-D (CSE)':{M_ROW_COL:15, M_CHAR_EQ_SIGN:9}};
  const base = {M_EIGEN_DIAG:24, M_CRIT_ALWAYS_EXT:17, M_PRODUCT:14, M_VALUE_SLOPE:9};
  const R = rng(4242); const data = {};
  for (const s of SECTIONS){ data[s] = {}; for (const id of ids) data[s][id] = Math.round(4 + R() * 9 + (base[id] || 0) + ((bias[s] || {})[id] || 0)); }
  return {ids, data, n:{'I-A (Mech)':62,'I-B (Civil)':58,'I-C (ECE)':64,'I-D (CSE)':60}};
}

/* ---------- Offline syllabus reader (fallback when AI is not available) ---------- */

function parseSyllabusText(text, poText){

      for (let i = 0; i < q.rect.w; i += 2){ const x = q.xmin + (q.xmax - q.xmin) * i / q.rect.w, y = fp(x); ctx.fillStyle = y >= 0 ? cssv('--good') : cssv('--bad'); const y0 = q.Y(0), y1 = q.Y(y); ctx.fillRect(q.X(x), Math.min(y0, y1), 2, Math.abs(y1 - y0)); }

      } else ro = `<span>${en ? 'f′(x) > 0 everywhere: no critical points.' : 'எங்கும் f′(x) > 0: மாறுநிலைப் புள்ளிகள் இல்லை.'}</span>`;

  },
  lintrans:{
    ctrls:() => `${rng_('ma', 'a', -2, 2, 0.1, 1)}${rng_('mb', 'b', -2, 2, 0.1, 1)}${rng_('mc', 'c', -2, 2, 0.1, 0)}${rng_('md', 'd', -2, 2, 0.1, 1)}`,
    presets:[['Shear', [1,1,0,1]], ['Rotate 90°', [0,-1,1,0]], ['Reflect y = x', [0,1,1,0]], ['Stretch', [2,0,0,1.5]], ['Squash (det 0)', [1,2,0.5,1]], ['Identity', [1,0,0,1]]],
    draw(){

      graphPaper(p, 1, 1);
      const T = (x, y) => [a * x + b * y, c * x + d * y];
      const {ctx} = base; clip(p);
      ctx.strokeStyle = cssv('--vec'); ctx.globalAlpha = .35; ctx.lineWidth = 1;
      for (let k = -8; k <= 8; k++){
        let [x1, y1] = T(k, -8), [x2, y2] = T(k, 8); ctx.beginPath(); ctx.moveTo(p.X(x1), p.Y(y1)); ctx.lineTo(p.X(x2), p.Y(y2)); ctx.stroke();
        [x1, y1] = T(-8, k); [x2, y2] = T(8, k); ctx.beginPath(); ctx.moveTo(p.X(x1), p.Y(y1)); ctx.lineTo(p.X(x2), p.Y(y2)); ctx.stroke();

      ctx.globalAlpha = 1; ctx.strokeStyle = cssv('--accent'); ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();

    }
  },
  eigen:{
    mats:[[2,1,1,2],[3,1,0,2],[1,2,2,-2],[0,-1,1,0]],
    ctrls:() => `<div class="ctrl"><label for="em">A</label><select id="em" class="sel" style="width:100%">${VIS.eigen.mats.map((m, i) => `<option value="${i}">[[${m[0]}, ${m[1]}], [${m[2]}, ${m[3]}]]${i === 3 ? ' (rotation)' : ''}</option>`).join('')}</select></div>${rng_('th', 'θ (°)', 0, 180, 0.5, 20)}<div class="ctrl"><label>&nbsp;</label><div class="row"><button class="btn small" id="sweep" type="button">${state.lang === 'en' ? 'Sweep θ' : 'θ-ஐச் சுழற்று'}</button><label class="row note" style="gap:6px"><input type="checkbox" id="showE"> ${state.lang === 'en' ? 'show eigen directions' : 'ஐகன் திசைகளைக் காட்டு'}</label></div></div>`,
    draw(){

      const p = region(base, {x:10, y:10, w:base.w - 20, h:base.h - 20}, -3.8, 3.8, -3.8, 3.8, true);
      graphPaper(p, 0.5, 1);

      ctx.strokeStyle = cssv('--grid2'); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(p.X(0), p.Y(0), p.sx, 0, 7); ctx.stroke();
      clip(p); ctx.strokeStyle = cssv('--accent'); ctx.globalAlpha = .45; ctx.setLineDash([3, 4]); ctx.beginPath();
      for (let i = 0; i <= 120; i++){ const t = i / 120 * 2 * Math.PI, x = a * Math.cos(t) + b * Math.sin(t), y = c * Math.cos(t) + d * Math.sin(t); i ? ctx.lineTo(p.X(x), p.Y(y)) : ctx.moveTo(p.X(x), p.Y(y)); }
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.restore();

      if ($('#showE').checked && disc >= 0){
        for (const lam of [(tr + Math.sqrt(disc)) / 2, (tr - Math.sqrt(disc)) / 2]){
          let v = Math.abs(b) > 1e-9 ? [b, lam - a] : Math.abs(c) > 1e-9 ? [lam - d, c] : (Math.abs(lam - a) < 1e-9 ? [1, 0] : [0, 1]);
          const L = Math.hypot(...v); v = [v[0] / L, v[1] / L];
          plotFn({...p, ctx}, x => Math.abs(v[0]) < 1e-9 ? NaN : v[1] / v[0] * x, cssv('--warn'), 1.5, [6, 5]);
          if (Math.abs(v[0]) < 1e-9){ ctx.strokeStyle = cssv('--warn'); ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.moveTo(p.X(0), p.Y(p.ymin)); ctx.lineTo(p.X(0), p.Y(p.ymax)); ctx.stroke(); ctx.setLineDash([]); }

    }
  }
};
function rng_(id, label, min, max, step, val){ return `<div class="ctrl"><label for="${id}"><span>${label}</span><output id="${id}o">${val}</output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`; }

/* ---------- ASK ---------- */
function panelAsk(c){
  const p = prog(c.id);
  let h = `<p class="hint">${Lh(UI.askHint)}</p><div class="qlist">`;
  c.ask.forEach((q, qi) => {
    const st = p.ask[qi] || {};
    h += `<div class="card qcard"><div class="qn">Q${qi + 1}</div><div class="qt">${Lh(q.q)}</div><div class="opts">`;
    q.opts.forEach((o, oi) => {
      const tried = (st.tried || []).includes(oi), cls = tried ? (o.ok ? 'right' : 'wrong') : '';
      h += `<button class="opt ${cls}" data-q="${qi}" data-o="${oi}" ${st.done ? 'disabled' : ''}><span class="k">${String.fromCharCode(65 + oi)}</span><span>${Lh(o.t)}</span></button>`;
    });
    h += `</div>`;
    if (st.last != null){ const o = q.opts[st.last]; h += `<div class="fb ${o.ok ? 'good' : 'bad'}">${o.mis ? `<div class="tag">${Lb(UI.misconception)}: ${Lh(MIS[o.mis])}</div>` : ''}${Lh(o.fb)}</div>`; }
    h += `</div>`;
  });
  h += `</div>${tutorBox(c)}${nextBtn('check')}`;
  $('#panel').innerHTML = h;
  $$('.opt').forEach(b => b.onclick = () => {
    const qi = +b.dataset.q, oi = +b.dataset.o, q = c.ask[qi], o = q.opts[oi];
    const st = p.ask[qi] || (p.ask[qi] = {tried:[]});
    if (!st.tried.includes(oi)) st.tried.push(oi);
    if (st.first == null) st.first = !!o.ok;
    st.last = oi; if (o.ok) st.done = true; else logMis(o.mis, 'ask');
    save(); panelAsk(c); renderRail();
  });
  bindTutor(c); bindNext();
}
function tutorBox(c){
  const turns = state.chat[c.id] || [];
  return `<div class="card chat"><div class="row" style="justify-content:space-between"><b>${Lb(UI.askTutor)}</b><span class="chip ai">AI</span></div>
    <div class="msgs" id="msgs">${turns.map(t => `<div class="msg ${t.role === 'user' ? 'me' : 'ai'}">${esc(t.content)}</div>`).join('')}</div>
    <textarea class="box" id="tq" rows="2" placeholder="${esc(Lt(UI.askPlaceholder))}"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn ai" id="tsend">${Lb(UI.send)}</button><button class="btn small" id="tstop" hidden>${Lb(UI.stop)}</button>${AI.sample ? '' : `<span class="note">${Lh(UI.aiOff)}</span>`}</div></div>`;
}
let tutorCtl = null;
function bindTutor(c){
  const send = $('#tsend'); if (!send) return;
  send.onclick = async () => {
    if (!AI.sample){ needAI(); return; } const q = $('#tq').value.trim(); if (!q) return;
    const turns = state.chat[c.id] || (state.chat[c.id] = []);
    turns.push({role:'user', content:q}); $('#tq').value = '';
    const msgs = $('#msgs'); msgs.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(q)}</div><div class="msg ai" id="live">${esc(Lt(UI.thinking))}</div>`);
    const live = $('#live'); live.removeAttribute('id');
    const rules = `You are GanitaDrishti, a patient mathematics tutor for first-year engineering students in Tamil Nadu, India. The topic is "${c.name.en}". The student has just used this interactive visual: ${c.see.en}\nReply in ${langName()}. Use the Socratic method: give one short, clear explanation tied to the visual, then ask one guiding question. Keep it under 120 words. Write maths in plain text (x^2, sin x, f'(x)); no LaTeX, no markdown headings.`;
    tutorCtl = new AbortController(); send.disabled = true; $('#tstop').hidden = false; $('#tstop').onclick = () => tutorCtl.abort();
    try {
      const {text} = await AI.sample([{role:'user', content:rules}, ...turns.slice(-8)], {cache:false, signal:tutorCtl.signal, onText:({text}) => { live.textContent = text; }});
      turns.push({role:'assistant', content:text});
    } catch (e) { live.textContent = e.text || aiErr(e); turns.pop(); }
    finally { send.disabled = false; const s = $('#tstop'); if (s) s.hidden = true; }
  };
}
function aiErr(e){
  if (e && e.code === 'not_granted' && AI.status !== 'denied'){ AI.status = 'denied'; setTimeout(() => renderAINote(), 0); }
  const en = state.lang === 'en';
  const m = {not_granted: en ? 'AI is not allowed for this page.' : 'இந்தப் பக்கத்திற்கு AI அனுமதிக்கப்படவில்லை.', rate_limited: en ? 'Too many requests just now. Try again in a minute.' : 'அதிகக் கோரிக்கைகள். ஒரு நிமிடம் கழித்து முயலுங்கள்.', cancelled: en ? 'Stopped.' : 'நிறுத்தப்பட்டது.', images_unavailable: en ? 'Photos cannot be sent from this view.' : 'இந்தக் காட்சியில் புகைப்படம் அனுப்ப இயலாது.', image_rejected: en ? 'That photo could not be read. Try a clearer JPEG or PNG.' : 'அந்தப் புகைப்படத்தைப் படிக்க இயலவில்லை.', invalid_json: en ? 'The AI reply was incomplete. Try again.' : 'AI பதில் முழுமையாக இல்லை. மீண்டும் முயலுங்கள்.'};
  return m[e && e.code] || (en ? 'The AI could not answer right now. Try again.' : 'AI இப்போது பதிலளிக்க இயலவில்லை.');

  $('#doAI').onclick = () => aiDiagnose(c);

function applyCheckResult(c, r){

function renderResult(c, r){

function panelApply(c){
  const p = prog(c.id); const lvl = p.level || 1;
  let cur = state.apply[c.id];
  if (!cur || cur.level !== lvl) cur = state.apply[c.id] = {level:lvl, prob:GEN[c.id][lvl - 1](), done:false, res:null};
  const pr = cur.prob;
  $('#panel').innerHTML = `<p class="hint">${Lh(UI.applyHint)}</p>
   <div class="card">
     <div class="row" style="justify-content:space-between"><span><b>${Lb(UI.level)} ${lvl}</b> <span class="pips">${[1, 2, 3].map(i => `<i class="${i <= lvl ? 'on' : ''}"></i>`).join('')}</span></span><span class="note">${state.lang === 'en' ? 'Solved' : 'தீர்த்தவை'}: ${p.applyOk || 0}</span></div>
     <p class="prob" style="margin-top:12px">${Lh(pr.q)}</p>
     <div class="ansrow"><label for="ans" class="note">${Lb(UI.yourAnswer)}</label><input id="ans" inputmode="decimal" autocomplete="off" ${cur.done ? 'disabled' : ''}> <span class="mono muted">${esc(pr.unit || '')}</span>
       <button class="btn primary" id="sub" ${cur.done ? 'disabled' : ''}>${Lb(UI.submit)}</button><button class="btn" id="newp">${Lb(UI.newProblem)}</button></div>
     <div id="afb" aria-live="polite" style="margin-top:12px"></div>
   </div>`;
  const showFb = () => {
    const r = cur.res; if (!r) return;
    let h = r.ok ? `<span class="pill ok">✓ ${Lb(UI.correct)}</span>${r.up ? ` <span class="pill ok">${Lb(UI.levelUp)} → ${p.level}</span>` : ''}` : `<span class="pill bad">✗ ${Lb(UI.notQuite)}</span> <span class="note">${Lb(UI.answerWas)}: <b class="mono">${pr.ans} ${esc(pr.unit || '')}</b></span>`;
    h += `<div class="sol"><b>${Lb(UI.workedSol)}</b>\n${Lpre(pr.sol)}</div>`;
    if (!r.ok){
      h += `<div class="misbox" style="margin-top:10px"><div class="id">${Lb(UI.misconception)} (${state.lang === 'en' ? 'likely' : 'சாத்தியமான'}) · ${pr.mis}</div>${Lh(MIS[pr.mis])}</div>`;
      h += `<div class="row" style="margin-top:10px"><button class="btn ai small" id="exp">${Lb(UI.explainMistake)} <span class="chip ai">AI</span></button></div><div id="expOut" class="msg ai" style="margin-top:8px" hidden></div>`;
    }
    $('#afb').innerHTML = h;
    const ex = $('#exp');
    if (ex) ex.onclick = async () => {
      const out = $('#expOut'); out.hidden = false; out.textContent = Lt(UI.thinking); ex.disabled = true;
      try {
        const prompt = `A first-year engineering student in Tamil Nadu answered this problem.\nProblem: ${pr.q.en}\nCorrect answer: ${pr.ans} ${pr.unit || ''}\nWorked solution: ${pr.sol.en}\nStudent's answer: ${r.given}\nIn ${langName()}, explain in under 90 words what the student most likely did wrong (guess the specific slip from the number they gave) and how to avoid it next time. Plain-text maths, no headings.`;
        await AI.sample(prompt, {onText:({text}) => { out.textContent = text; }});
      } catch (e) { out.textContent = e.text || aiErr(e); }
      finally { ex.disabled = false; }
    };
  };
  showFb();
  $('#sub').onclick = () => {
    const raw = $('#ans').value.trim(); if (!raw) return;
    const g = tryParse(raw.replace(/,/g, '')); const v = g && !g.usesVar ? g(0) : NaN;
    if (!isFinite(v)){ $('#afb').innerHTML = `<span class="note">${state.lang === 'en' ? 'Enter a number, for example 12.5' : 'ஒரு எண்ணை உள்ளிடுங்கள், எ.கா. 12.5'}</span>`; return; }
    const tol = pr.tol != null ? Math.max(pr.tol, 0.011 * Math.abs(pr.ans)) : 1e-6 * (1 + Math.abs(pr.ans));
    const ok = Math.abs(v - pr.ans) <= tol; let up = false;
    if (ok){ p.applyOk = (p.applyOk || 0) + 1; p.streak = (p.streak || 0) + 1; if (p.streak >= 2 && (p.level || 1) < 3){ p.level = (p.level || 1) + 1; p.streak = 0; up = true; } }
    else { p.streak = 0; logMis(pr.mis, 'apply'); }
    cur.done = true; cur.res = {ok, up, given: raw}; save(); renderRail();

  };
}

function sparkSVG(hist){
  hist = hist.map(v => Math.log10(1 + v)); const w = 280, h = 56, mx = Math.max(...hist), mn = Math.min(...hist);
  const X = i => 4 + i / (hist.length - 1) * (w - 8), Y = v => 6 + (mx === mn ? 0.5 : (mx - v) / (mx - mn)) * (h - 14);
  const pts = hist.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Best penalty per iteration"><line x1="4" x2="${w - 4}" y1="${h - 2}" y2="${h - 2}" stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${X(hist.length - 1)}" cy="${Y(hist.at(-1))}" r="3.5" fill="var(--accent)"/></svg>`;
}

/* ---------- syllabus import: reading PDF / Word files ---------- */
const LIBS = {
  pdf: ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'],
  docx: ['https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js']
};
const loadedLibs = {};
function loadScript(src){
  return loadedLibs[src] || (loadedLibs[src] = new Promise((res, rej) => {
    const el = document.createElement('script'); el.src = src; el.onload = res;
    el.onerror = () => { delete loadedLibs[src]; rej(new Error('The file reader could not be loaded. Check the connection and try again, or paste the text instead.')); };
    document.head.appendChild(el);
  }));
}
async function readDoc(file){
  const name = file.name.toLowerCase();
  if (name.endsWith('.pdf')){
    for (const u of LIBS.pdf) await loadScript(u);   // worker first: pdf.js then runs it on the page itself
    const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIBS.pdf[0];
    const pdf = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    let out = '';
    for (let i = 1; i <= Math.min(pdf.numPages, 40); i++){
      const tc = await (await pdf.getPage(i)).getTextContent();
      let line = '';
      for (const it of tc.items){ line += it.str; if (it.hasEOL){ out += line + '\n'; line = ''; } else if (it.str && !it.str.endsWith(' ')) line += ' '; }
      out += line + '\n';
    }
    return {text: out, pdf};
  }
  if (name.endsWith('.docx')){
    await loadScript(LIBS.docx[0]);
    const r = await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
    return {text: r.value};
  }
  if (name.endsWith('.doc')) throw new Error('Older .doc files cannot be read here. Save the file as .docx or PDF and upload it again.');
  return {text: await file.text()};
}
async function pdfImages(pdf, n){
  const blobs = [];
  for (let i = 1; i <= Math.min(pdf.numPages, n); i++){
    const page = await pdf.getPage(i); const vp = page.getViewport({scale: 1.6});
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    blobs.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85)));
  }
  return blobs;
}
async function extractWithAI(text, poText, images){
  const prompt = `You are setting up a course in an outcome-based education (OBE) system for an Indian engineering college.
From the documents below, extract the course details.
${images ? 'The syllabus is in the attached page images (a scanned document).' : 'SYLLABUS:\n' + text.slice(0, 60000)}
${poText ? '\nPROGRAMME OUTCOMES / PROGRAMME SPECIFIC OUTCOMES:\n' + poText.slice(0, 15000) : ''}
Reply with only JSON:
{"code": course code, "name": course title,
 "units": [{"no": 1, "title": unit title, "topics": the unit's topics in one line}],
 "cos": [{"id": "CO1", "text": course outcome statement, "unit": unit number it mainly covers}],
 "pos": [{"id": "PO1", "name": short name}] including PSOs as "PSO1", "PSO2" if given,
 "map": {"CO1": {"PO1": 3, "PO2": 2}}, "map_source": "document" or "suggested"}
Rules: copy CO statements as written. If the documents list no COs, write one CO per unit starting with an action verb. If no POs are given, return the 12 NBA programme outcomes. If a CO–PO matrix is present, copy it (values 1–3, omit blanks) and set map_source "document"; otherwise suggest a sensible mapping and set map_source "suggested".`;
  const opts = {modelTier: 'default'}; if (images) opts.images = images;
  const j = await AI.sample.json(prompt, opts);
  const units = (Array.isArray(j.units) ? j.units : []).map((u, i) => ({no: +u.no || i + 1, title: String(u.title || 'Unit ' + (i + 1)), topics: String(u.topics || '')}));
  const cos = (Array.isArray(j.cos) ? j.cos : []).map((c, i) => ({id: /^CO\s*\d+$/i.test(String(c.id)) ? String(c.id).toUpperCase().replace(/\s/g, '') : 'CO' + (i + 1), text: String(c.text || '').trim(), unit: +c.unit || i + 1})).filter(c => c.text);
  const pos = Array.isArray(j.pos) && j.pos.length ? j.pos.map(p => [String(p.id).toUpperCase().replace(/\s/g, ''), String(p.name || '')]) : null;
  const map = {};
  if (j.map && typeof j.map === 'object') for (const [co, row] of Object.entries(j.map)){ const r = {}; for (const [po, v] of Object.entries(row || {})){ const n = Math.round(+v); if (n >= 1 && n <= 3) r[String(po).toUpperCase().replace(/\s/g, '')] = n; } map[String(co).toUpperCase().replace(/\s/g, '')] = r; }
  return {code: String(j.code || 'NEW101'), name: String(j.name || 'Imported course'), units, cos, pos, map, mapSrc: j.map_source === 'document' ? 'document' : Object.keys(map).length ? 'suggested' : 'none'};
}

  if (!sylF && !pasted.trim()){ state.imp = {status:'error', msg:'Choose a syllabus file or paste the syllabus text first.'}; tabSetup(); return; }

    if (poF) poText = (await readDoc(poF)).text;
    let images = null;
    if (text.replace(/\s/g, '').length < 150){

async function draftBank(btn){
  const C = state.course, msg = $('#bankMsg'), bm = state.qpCfg.bMarks || 16;
  btn.disabled = true; let added = 0, failed = 0;
  for (let i = 0; i < C.cos.length; i++){
    const co = C.cos[i];
    if (C.bank.filter(q => q.co === co.id).length >= 8) continue;
    const unit = (C.units || []).find(u => u.no === co.unit) || (C.units || [])[i];
    msg.textContent = `Drafting questions for ${co.id} (${i + 1} of ${C.cos.length})…`;
    try {
      const arr = await AI.sample.json(`You are setting questions for an Indian university end-semester examination.
Course: ${C.code} ${C.name}
Course outcome ${co.id}: ${co.text}
${unit ? `Related syllabus unit: ${unit.title}. Topics: ${unit.topics}` : ''}
Write 4 short-answer questions worth 2 marks and 4 long-answer questions worth ${bm} marks (long ones may have parts (i) and (ii)).
Bloom's levels: short questions K1–K3; long questions K3–K5. Rate difficulty 1 (easy) to 3 (hard).
Each question must be self-contained, unambiguous and solvable, with clean numbers. Plain text with Unicode maths symbols, no LaTeX.
Reply with only a JSON array of 8 objects: {"t": question text, "m": 2 or ${bm}, "k": Bloom level 1–6, "d": 1–3}`, {modelTier:'default'});
      for (const q of (Array.isArray(arr) ? arr : [])){
        if (!q || !q.t) continue;
        const m = +q.m === 2 ? 2 : 16, pre = (m === 2 ? 'A' : 'B') + co.id.slice(2);
        let n = 1; while (C.bank.some(x => x.id === pre + String(n).padStart(2, '0'))) n++;
        C.bank.push({id: pre + String(n).padStart(2, '0'), co: co.id, k: Math.min(6, Math.max(1, Math.round(+q.k) || 3)), m, d: Math.min(3, Math.max(1, Math.round(+q.d) || 2)), t: String(q.t), src: 'ai'});
        added++;
      }
      saveCourse();
    } catch (e) { failed++; if (e && (e.code === 'not_granted' || e.code === 'rate_limited')){ msg.textContent = aiErr(e); break; } }
  }
  toast(`${added} draft questions added${failed ? `, ${failed} CO${failed > 1 ? 's' : ''} failed` : ''}`);
  renderCollege();
}

  else if (I.status === 'preview'){
    const P = I.preview, nPO = (P.pos || POS).length;
    body = `<div class="grid2" style="margin-top:8px"><div class="f"><label for="pcode" class="note">Course code</label><input type="text" id="pcode" value="${esc(P.code)}"></div><div class="f"><label for="pname" class="note">Course name</label><input type="text" id="pname" value="${esc(P.name)}"></div></div>
      <p class="note">Read with ${esc(P.via)}. ${P.units.length} units · ${P.cos.length} COs · ${nPO} POs/PSOs (${P.pos ? 'from your document' : 'NBA defaults'}) · CO–PO mapping ${P.mapSrc === 'document' ? 'copied from your document' : P.mapSrc === 'suggested' ? 'suggested by AI, please review' : 'not found; set it after creating the course'}.</p>
      <div class="grid2" style="margin-top:4px"><div><b>Units</b><ol class="mini plist">${P.units.map(u => `<li><b>${esc(u.title)}</b><br><span class="muted">${esc(u.topics.slice(0, 160))}${u.topics.length > 160 ? '…' : ''}</span></li>`).join('') || '<li class="muted">None found</li>'}</ol></div>
      <div><b>Course outcomes</b><ul class="mini plist">${P.cos.map(c => `<li><b>${esc(c.id)}</b> ${esc(c.text)}</li>`).join('')}</ul></div></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="impOk">Create course</button><button class="btn" id="impNo">Discard</button></div>`;
  } else {
    body = `<div class="grid2" style="margin-top:10px">
        <div class="f"><label for="sylF" class="note"><b>Syllabus</b> · PDF, Word (.docx) or text</label><input type="file" id="sylF" class="filein" accept="${acc}"></div>
        <div class="f"><label for="poF" class="note"><b>POs and PSOs</b> · optional; the 12 NBA POs are used if empty</label><input type="file" id="poF" class="filein" accept="${acc}"></div></div>
      <details style="margin-top:10px"><summary class="note">Or paste the syllabus text</summary><textarea class="box" id="sylT" rows="6" placeholder="Paste the units, topics and course outcomes"></textarea></details>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="impGo">Read and set up course</button><span class="note" style="max-width:60ch">${AI.sample ? 'The AI reads units, COs, POs/PSOs and any CO–PO matrix, including scanned PDFs.' : 'Offline reader: finds units, COs, POs and a CO–PO matrix when the document lists them. In the Claude app the AI reads it more fully.'}</span></div>
      ${I.status === 'error' ? `<p class="bad-t mini" style="margin:8px 0 0">${esc(I.msg)}</p>` : ''}`;
  }
  return `<div class="card" id="imp"><div class="row" style="justify-content:space-between"><b>Add a course from its syllabus</b><span class="chip ai">AI</span></div><p class="note" style="margin:2px 0 0;max-width:80ch">Upload the course syllabus and your programme's POs/PSOs. The course, its COs and the CO–PO mapping are set up for you. Then draft a question bank and generate papers in the Question paper tab.</p><div id="impBody">${body}</div></div>`;
}

function tabSetup(){
  const C = state.course; const f = state.setupF || (state.setupF = {co:'all', part:'all'});
  if (f.co !== 'all' && !C.cos.some(c => c.id === f.co)) f.co = 'all';
  const bank = C.bank.filter(q => (f.co === 'all' || q.co === f.co) && (f.part === 'all' || (f.part === 'A' ? q.m === 2 : q.m !== 2)));
  const bm = state.qpCfg.bMarks || 16, P_ = cPOS(), nAI = C.bank.filter(q => q.src === 'ai').length;
  $('#cpanel').innerHTML = impCard() + `
   <div class="grid2">
    <div class="card form"><b>Course</b>
      <div class="f"><label for="ccode">Course code</label><input type="text" id="ccode" value="${esc(C.code)}"></div>
      <div class="f"><label for="cname">Course name</label><input type="text" id="cname" value="${esc(C.name)}"></div>
      <b style="margin-top:6px">Course outcomes</b>
      ${C.cos.map((c, i) => `<div class="f"><label for="co${i}">${esc(c.id)}</label><input type="text" id="co${i}" data-i="${i}" class="cotext" value="${esc(c.text)}"></div>`).join('')}
      ${C.units && C.units.length ? `<b style="margin-top:6px">Units</b><ol class="mini plist" style="margin:0">${C.units.map(u => `<li><b>${esc(u.title)}</b> <span class="muted">${esc(u.topics.slice(0, 120))}${u.topics.length > 120 ? '…' : ''}</span></li>`).join('')}</ol>` : ''}
    </div>
    <div class="card" style="min-width:0"><b>CO–PO${P_.some(p => p[0].startsWith('PSO')) ? '/PSO' : ''} mapping</b><p class="note" style="margin:2px 0 8px">1 low · 2 medium · 3 high · – none${C.src === 'import' ? ' · imported values; review before use' : ''}</p>
      <div class="scroll"><table class="tbl"><tr><th>CO</th>${P_.map(([p, n]) => `<th class="c" title="${esc(n)}">${esc(p)}</th>`).join('')}</tr>
      ${C.cos.map(c => `<tr><td><b>${esc(c.id)}</b></td>${P_.map(([p]) => { const v = (C.map[c.id] || {})[p] || 0; return `<td class="c"><select class="mp" data-co="${esc(c.id)}" data-po="${esc(p)}" aria-label="${esc(c.id)} ${esc(p)}">${[0, 1, 2, 3].map(k => `<option value="${k}" ${k === v ? 'selected' : ''}>${k || '–'}</option>`).join('')}</select></td>`; }).join('')}</tr>`).join('')}
      </table></div></div>
   </div>
   <div class="card" style="margin-top:16px">
     <div class="row" style="justify-content:space-between"><b>Question bank · ${C.bank.length} questions${nAI ? ` · ${nAI} AI drafts` : ''}</b>
      <div class="row"><select id="fco" class="sel"><option value="all">All COs</option>${C.cos.map(c => `<option ${f.co === c.id ? 'selected' : ''}>${esc(c.id)}</option>`).join('')}</select><select id="fpart" class="sel"><option value="all">Both parts</option><option value="A" ${f.part === 'A' ? 'selected' : ''}>Part A (2 marks)</option><option value="B" ${f.part === 'B' ? 'selected' : ''}>Part B (${bm} marks)</option></select></div></div>
     <div class="row" style="margin-top:10px"><button class="btn ai" id="draft">Draft question bank with AI (8 per CO) <span class="chip ai">AI</span></button><span class="note" id="bankMsg">${AI.sample ? 'Drafts are tagged so faculty can review them before a paper is used.' : 'AI drafting works in the Claude app. You can add questions by hand below.'}</span></div>
     ${C.bank.length ? `<div class="scroll" style="margin-top:10px"><table class="tbl"><tr><th>ID</th><th>Question</th><th class="c">CO</th><th class="c">Bloom</th><th class="c">Diff.</th><th class="c">Marks</th></tr>
      ${bank.map(q => `<tr><td class="mono mini">${esc(q.id)}${q.src === 'ai' ? '<br><span class="chip ai" style="margin-top:4px">AI draft</span>' : ''}</td><td>${esc(q.t)}</td><td class="c">${esc(q.co)}</td><td class="c">K${q.k}</td><td class="c">${q.d}</td><td class="c">${q.m === 2 ? 2 : bm}</td></tr>`).join('')}
     </table></div>` : '<div class="empty" style="margin-top:10px">No questions yet.</div>'}
     <form id="addQ" class="row" style="margin-top:12px;align-items:flex-end">
      <div class="f" style="flex:1 1 320px"><label for="nq" class="note">New question</label><input type="text" id="nq" required placeholder="Type the question text" style="width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px"></div>
      <select id="nco" class="sel" aria-label="CO">${C.cos.map(c => `<option>${esc(c.id)}</option>`).join('')}</select>
      <select id="nk" class="sel" aria-label="Bloom level">${Object.entries(BLOOM).map(([k, n]) => `<option value="${k}" ${k === '3' ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <select id="nd" class="sel" aria-label="Difficulty"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select>
      <select id="nm" class="sel" aria-label="Marks"><option value="2">2 marks</option><option value="16">${bm} marks</option></select>
      <button class="btn primary" type="submit">Add to bank</button>
     </form>
     <div class="row" style="margin-top:14px" id="rstBox">${C.sample ? '<button class="linkbtn" id="rstCourse">Restore the sample course</button>' : state.courses.length > 1 ? '<button class="linkbtn" id="delCourse">Delete this course</button>' : ''}</div>
   </div>`;
  // import card
  const go = $('#impGo'); if (go) go.onclick = runImport;
  const ok = $('#impOk');
  if (ok) ok.onclick = () => {
    const P = state.imp.preview;
    state.courses.push({code: $('#pcode').value.trim() || P.code, name: $('#pname').value.trim() || P.name, units: P.units, cos: P.cos, pos: P.pos, map: P.map || {}, bank: [], src: 'import'});
    switchCourse(state.courses.length - 1); saveCourse(); state.imp = {status:'idle'};
    toast('Course created. Next: draft its question bank.'); renderCollege();
  };
  const no = $('#impNo'); if (no) no.onclick = () => { state.imp = {status:'idle'}; tabSetup(); };
  // course editing
  $('#ccode').onchange = e => { C.code = e.target.value.trim() || C.code; saveCourse(); };
  $('#cname').onchange = e => { C.name = e.target.value.trim() || C.name; saveCourse(); };
  $$('.cotext').forEach(i => i.onchange = () => { C.cos[+i.dataset.i].text = i.value; saveCourse(); });
  $$('.mp').forEach(s => s.onchange = () => { const m = C.map[s.dataset.co] || (C.map[s.dataset.co] = {}); const v = +s.value; if (v) m[s.dataset.po] = v; else delete m[s.dataset.po]; saveCourse(); });
  $('#fco').onchange = e => { f.co = e.target.value; tabSetup(); };
  $('#fpart').onchange = e => { f.part = e.target.value; tabSetup(); };
  $('#draft').onclick = e => draftBank(e.currentTarget);
  $('#addQ').onsubmit = e => {
    e.preventDefault(); const t = $('#nq').value.trim(); if (!t) return;
    const co = $('#nco').value, m = +$('#nm').value; const pre = (m === 2 ? 'A' : 'B') + co.slice(2);
    let n = 1; while (C.bank.some(q => q.id === pre + String(n).padStart(2, '0'))) n++;
    C.bank.push({id: pre + String(n).padStart(2, '0'), co, k: +$('#nk').value, m, d: +$('#nd').value, t});
    saveCourse(); toast('Question added'); renderCollege();
  };
  const rst = $('#rstCourse');
  if (rst) rst.onclick = () => {
    $('#rstBox').innerHTML = `<span class="note">Replace this course, its mapping and bank with the original sample?</span> <button class="btn small" id="rY">Restore</button> <button class="btn small" id="rN">Keep mine</button>`;
    $('#rY').onclick = () => { state.course = Object.assign(clone(DEFAULT_COURSE), {sample:true}); saveCourse(); renderCollege(); };
    $('#rN').onclick = tabSetup;
  };
  const del = $('#delCourse');
  if (del) del.onclick = () => {
    $('#rstBox').innerHTML = `<span class="note">Delete ${esc(C.code)} and its question bank from this browser?</span> <button class="btn small" id="dY">Delete</button> <button class="btn small" id="dN">Keep</button>`;
    $('#dY').onclick = () => { state.courses.splice(state.ci, 1); switchCourse(0); saveCourse(); renderCollege(); };
    $('#dN').onclick = tabSetup;
  };
}

/* ---------- file offers ---------- */
async function offerFile(name, data){
  if (AI.downloads){
    try { await AI.downloads.save({filename:name, data}); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  const m = $('#modal'); m.hidden = false;
  m.innerHTML = `<div class="card" role="dialog" aria-label="File contents"><div class="row" style="justify-content:space-between"><b>${esc(name)}</b><button class="btn small" id="mClose">Close</button></div><p class="note" style="margin:0">Saving files is not available in this view. Copy the contents and save them as ${esc(name)}.</p><textarea class="box" id="mText" readonly>${esc(data)}</textarea><div class="row"><button class="btn primary small" id="mCopy">Copy</button></div></div>`;
  $('#mClose').onclick = () => { m.hidden = true; m.innerHTML = ''; };
  $('#mCopy').onclick = () => { const t = $('#mText'); navigator.clipboard.writeText(t.value).then(() => toast('Copied')).catch(() => { t.focus(); t.select(); }); };
}

/* ---------- theme changes redraw the canvas ---------- */
const redrawSee = () => { if (state.role === 'student' && state.step === 'see' && VIS[state.concept]) VIS[state.concept].draw(); };
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawSee); } catch (e) {}
new MutationObserver(redrawSee).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* ---------- AI buttons explain how to turn AI on when it is unavailable ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.btn.ai:not(#aiFix)');
  if (b && !AI.sample){ e.preventDefault(); e.stopImmediatePropagation(); needAI(); }
}, true);

/* ---------- boot ---------- */
renderAll();
async function detectAI(again){
  try {
    if (!(window.claude && window.claude.use)){ AI.status = 'nohost'; }
    else {
      const [sm, d, p] = await Promise.all([window.claude.use('sample'), window.claude.use('downloads'), window.claude.use('permissions')]);
      AI.sample = sm; AI.downloads = d || AI.downloads; AI.perms = p;
      if (sm){
        AI.status = 'on';
        const lim = await sm.limits().catch(() => null);
        AI.images = !!(lim && lim.images); AI.imgTypes = lim && lim.images ? lim.images.mediaTypes : []; AI.maxImages = lim && lim.images ? lim.images.maxCount : 0;
        if (p){ const st = await p.state('sample').catch(() => null); if (st === 'denied') AI.status = 'denied'; }
      } else {
        const st = p ? await p.state('sample').catch(() => null) : null;
        AI.status = st === 'denied' ? 'denied' : 'off';
      }
    }
  } catch (e) { AI.status = AI.sample ? 'on' : 'off'; }
  AI.ready = true; renderAll();
  if (again && AI.status === 'on') toast('AI is on.');
}
detectAI();

</script>
